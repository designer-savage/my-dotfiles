# ─── hyprlock ──────────────────────────────────────────────────────────────
# macOS-style lock screen: dimmed, blurred wallpaper; the date above a large
# light-weight clock; the account cluster (avatar, name, capsule password
# field) sitting low, the way Sonoma arranges it.
#
# Colours come from pywal in two layers:
#   colors-hyprland.conf     raw palette ($foreground, $colorN)
#   glass-hyprlock.conf      normalised accent + glass tokens, written by
#                            ~/.local/bin/gen-glass-theme.py
source = ~/.cache/wal/colors-hyprland.conf
source = ~/.cache/wal/glass-hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = easeOut, 0.25, 0.75, 0.25, 1.0
    bezier = easeIn, 0.5, 0.0, 0.75, 0.25
    bezier = easeInOut, 0.5, 0.0, 0.5, 1.0

    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 2, easeIn
    animation = inputFieldDots, 1, 4, easeInOut
    animation = inputFieldFade, 1, 3, easeInOut
}

# ─── Wallpaper, pushed back ────────────────────────────────────────────────
# Heavier blur and a lower brightness than the desktop uses: the lock screen
# is a backdrop, not a surface you are meant to read anything off.
background {
    monitor =
    path = ~/wallpapers/current
    blur_passes = 4
    blur_size = 10
    noise = 0.008
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.25
    vibrancy_darkness = 0.2
}

# ─── Date, above the clock ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %-d %B"
    color = $label_secondary
    font_size = 30
    font_family = Adwaita Sans Medium
    position = 0, 445
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ─── Clock ─────────────────────────────────────────────────────────────────
# OPPO Big Clock (ColorOS lock-screen face) pinned at wght/HGHT 1000 and
# stretched 1.5x horizontally, colon kept round. The glyphs are ~4.2 em tall,
# so this size is ~500 px of ink. Installed as
# ~/.local/share/fonts/OPPOBigClockWide.ttf; the old clock is in
# hyprlock.conf.pre-oppo.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $label
    font_size = 89
    font_family = OPPO Big Clock Wide
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ─── Account cluster ───────────────────────────────────────────────────────
# ~/.face is the conventional place for an account picture on Linux, so other
# login surfaces (AccountsService, greeters) pick up the same image.
# rounding = -1 crops it to a full circle.
image {
    monitor =
    path = ~/.face
    size = 132
    rounding = -1
    border_size = 1
    border_color = $glass_line
    position = 0, -240
    halign = center
    valign = center
}

label {
    monitor =
    text = Designer
    color = $label
    font_size = 26
    font_family = Adwaita Sans Medium
    position = 0, -370
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ─── Password capsule ──────────────────────────────────────────────────────
# rounding = -1 makes it a full pill, which is the signature Apple control
# silhouette; the fill is the same glass token the rofi panels use.
input-field {
    monitor =
    size = 460, 64
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = -1
    outer_color = $glass_line
    inner_color = $glass
    font_color = $label
    font_family = Adwaita Sans
    fade_on_empty = false
    placeholder_text = <span foreground="##a9a9b2">Enter Password</span>
    hide_input = false
    rounding = -1
    check_color = $accent
    fail_color = rgb(ff453a)
    fail_text = <i>$FAIL</i>
    capslock_color = rgb(ffd60a)
    position = 0, -470
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.3)
}
