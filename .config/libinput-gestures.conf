# Порог в пикселях до признания свайпа
swipe_threshold 0

# 3 пальца влево → следующий рабочий стол, в том числе пустой.
# Hyprland 0.56 uses Lua dispatchers; this is the same focus dispatcher as SUPER+1–5.
gesture swipe left  3 hyprctl dispatch 'hl.dsp.focus({ workspace = "r+1" })'

# 3 пальца вправо → предыдущий рабочий стол.
gesture swipe right 3 hyprctl dispatch 'hl.dsp.focus({ workspace = "r-1" })'
